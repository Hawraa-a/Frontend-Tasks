<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="page">
            <div class="background">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>
    
            <div class="list">
                <input type="text" placeholder="Review Presentation">
                <button class="add-btn">Add</button>

                <div>
                <p>You have <span class="highlight">3</span> task(s) to complete</p>
                </div>

                <div class="task">
                    <input type="checkbox">
                    <span>Edit Video</span>
                    <div class="icons">
                        <button class="edit">📝</button>
                        <button class="delete">❌</button>
                    </div>
                </div>

                <div class="task done">
                    <input type="checkbox" checked>
                    <span>Buy Eggs & Milk</span>
                    <div class="icons">
                        <button class="edit">📝</button>
                        <button class="delete">❌</button>
                    </div>
                </div>

                <div class="task">
                    <input type="checkbox">
                    <span>Organize Files</span>
                    <div class="icons">
                        <button class="edit">📝</button>
                        <button class="delete">❌</button>
                    </div>
                </div>

                <div class="task">
                    <input type="checkbox">
                    <span>Write Blog Post</span>
                    <div class="icons">
                        <button class="edit">📝</button>
                        <button class="delete">❌</button>
                    </div>
                </div>
            </div>

            <div class="text">
                <p>With Free Source Code</p>
                <h1>TO DO LIST</h1>
                <p id="white-text">HTML, CSS, Javascript</p>
            </div>
        </div>
   </body>
</html>
