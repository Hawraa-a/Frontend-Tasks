<html>
    <body>
        <form>
            <label for="fullname"> FullName: </label>
            <input type="text" placeholder="Enter Your FullName" id="fullname" name="fullname">
            <br>
            <br>
            <label for="Email"> Email: </label>
            <input type="email" placeholder="Enter Your Email" id="Email" name="Email">
            <br>
            <br>
            <label for="Password"> Password: </label>
            <input type="password" placeholder="Enter Your Password" id="Password" name="Password">
            <br>
            <br>
            <label> Gender: </label>
            <br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br>
            <br>
            <label for="age">Age:</label>
            <input type="number" placeholder="Enter Your Age" id="age" name="age" min="18">
            <br>
            <br>
            <label for="birthdate">Date of Birth:</label>
            <input type="date" id="birthdate" name="birthdate" max="2007-12-31">
            <br>
            <br>
            <label for="File"> Upload your Cv: </label>
            <input type="file"  id="File" name="File">
            <br>
            <br>
            <label for="skills">Skills:</label>
            <br>
            <input type="checkbox" id="JS" name="skills" value="JS">
            <label for="JS">JS</label>
            <br>
            <input type="checkbox" id="Java" name="skills" value="Java">
            <label for="Java">Java</label>
            <br>
            <input type="checkbox" id="C++" name="skills" value="C++">
            <label for="C++">C++</label>
            <br>
            <br>
            <button>Click</button>
        </form>
    </body>
</html>
